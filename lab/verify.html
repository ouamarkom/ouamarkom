<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفعيل أوامركم | جارٍ تهيئة اقتصاد الأوامر...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #040916; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            height: 100vh; font-family: 'Cairo', sans-serif;
            color: #ffffff;
        }
        .spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(108, 92, 231, 0.1);
            border-top: 4px solid #6c5ce7;
            border-bottom: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.5rem; letter-spacing: 2px; color: #ffd700; }
        p { color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h1>جاري المصادقة...</h1>
    <p id="status">نحن نقوم بربط حسابك في اقتصاد الأوامر</p>

    <script>
        const SB_URL = "https://zadvakjxcnafarpsfbed.supabase.co";
        const SB_KEY = "sb_publishable_2WtEI98eClB2duklIMEMbg_uGM29Mem";
        
        const statusEl = document.getElementById('status');
        
        async function verify() {
            const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                statusEl.innerText = "رابط التفعيل غير صالح.";
                return;
            }

            const { error } = await supabaseClient.auth.verifyOtp({
                token_hash: token,
                type: 'signup'
            });

            if (error) {
                statusEl.innerText = "عذراً: " + error.message;
            } else {
                statusEl.innerText = "تم التفعيل بنجاح. أهلاً بك في المستقبل.";
                setTimeout(() => {
                    window.location.href = 'https://ouamarkom.com/lab/';
                }, 1000);
            }
        }
        verify();
    </script>
</body>
</html>
