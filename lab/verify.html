<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جارٍ تفعيل حسابك...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <p>جاري تفعيل حسابك، يرجى الانتظار...</p>
    <script type="module" src="config.js"></script> <script type="module">
        import { SB_URL, SB_KEY } from './config.js';
        const supabase = supabase.createClient(SB_URL, SB_KEY);
        
        // التقاط التوكن وتفعيله يدوياً
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        async function verify() {
            const { data, error } = await supabase.auth.verifyOtp({
                token_hash: token,
                type: 'signup'
            });
            if (!error) {
                window.location.href = 'https://ouamarkom.com/lab/';
            } else {
                alert("فشل التفعيل: " + error.message);
            }
        }
        verify();
    </script>
</body>
</html>
